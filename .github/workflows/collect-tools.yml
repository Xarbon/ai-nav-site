name: Collect AI Tools

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)
  workflow_dispatch:      # 手动触发
  push:
    branches:
      - main
    paths:
      - 'scripts/collect-tools/**'

env:
  NODE_VERSION: '20'

jobs:
  collect:
    name: Collect and Process AI Tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup/node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install collect-tools dependencies
        working-directory: scripts/collect-tools
        run: npm install

      - name: Run collection script
        env:
          PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/collect-tools/index.js

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_id }}
          path: scripts/collect-tools/reports/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Tool collection failed. Check logs for details."
